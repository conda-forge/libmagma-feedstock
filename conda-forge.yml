conda_build_tool: rattler-build
build_platform:
  linux_aarch64: linux_aarch64
  win_arm64: win_64
conda_build:
  error_overlinking: true
  pkg_format: '2'
  # Highest compression is 22. Increased compression to prevent timeout issue when
  # uploading packages. (Smaller package; less upload time)
  zstd_compression_level: 22
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
github_actions:
  triggers:
  - push
  - pull_request
  timeout_minutes: 360
provider:
  linux_64: github_actions
  linux_aarch64: github_actions
  win_64: github_actions
  win_arm64: github_actions
workflow_settings:
  free_disk_space:
    - provider: azure
      value: quick
  store_build_artifacts: true
