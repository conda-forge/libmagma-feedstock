# find  magma_* | sed "s/magma_/'/" | sed "s/\.h/',/"
{% set magma_headers = [
  'auxiliary',
  'batched',
  'bulge',
  'c',
  'cbatched',
  'cbulge',
  'cbulgeinc',
  'cgehrd_m',
  'clapack',
  'config',
  'copy',
  'cvbatched',
  'd',
  'dbatched',
  'dbulge',
  'dbulgeinc',
  'dgehrd_m',
  'dlapack',
  'ds',
  'dvbatched',
  'hbatched',
  'htc',
  'lapack',
  'mangling_cmake',
  'mangling',
  'operators',
  's',
  'sbatched',
  'sbulge',
  'sbulgeinc',
  'sgehrd_m',
  'slapack',
  'svbatched',
  'types',
  'v2',
  'vbatched',
  'z',
  'zbatched',
  'zbulge',
  'zbulgeinc',
  'zc',
  'zgehrd_m',
  'zlapack',
  'zvbatched'
] %}

{% set magmasparse_headers = [
  'c',
  'd',
  'mmio',
  's',
  'types',
  'z'
] %}

{% set magmablas_headers = [
  'c',
  'd',
  'ds',
  'h',
  's',
  'z',
  'zc',
] %}

{% set version = "2.10.0" %}

package:
  name: libmagma-split
  version: {{ version }}

source:
  - url: https://icl.utk.edu/projectsfiles/magma/downloads/magma-{{ version }}.tar.gz
    sha256: ea0c57fcb64ac2fd7ffe8f02d8fe18f07055c5b7fba0164f565d1e3a85148fb5

build:
  number: 1
  skip: true  # [cuda_compiler_version == "None"]
  # debugging skips below
  # skip: true  # [not (linux64 and cuda_compiler_version == "12.9")]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
    - cmake >=3.30,<4
    - libgomp  # [linux]
    - vcomp14  # [win]
    - arm-variant * {{ arm_variant_type }}  # [linux and aarch64 and cuda_compiler_version != "None"]
    # Commented out tools needed when doing source-code generation
    # - m2-coreutils  # [win]
    # - m2-make  # [win]
    # - m2-perl  # [win]
    # - make  # [unix]
    - ninja
  host:
    - cuda-version {{ cuda_compiler_version }}
    - cuda-cudart-dev
    - cuda-profiler-api
    - libcublas-dev
    - libcusparse-dev
    - liblapack
    - libblas
    - nomkl

outputs:
  - name: libmagma
    files:
      include:
        - lib  # [unix]
        - Library\bin  # [win]
      exclude:
        - lib/pkgconfig  # [unix]
        - lib/libmagma_sparse.so  # [linux]
        - Library\bin\magma_sparse.dll  # [win]
    build:
      ignore_run_exports:
        - cuda-version
      # Ignore run exports to implement CUDA minor version compatibility
      ignore_run_exports_from:
        - cuda-cudart-dev
        - libcublas-dev
        - libcusparse-dev
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
        - libgomp  # [linux]
        - vcomp14  # [win]
        - arm-variant * {{ arm_variant_type }}  # [linux and aarch64 and cuda_compiler_version != "None"]
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - libcublas-dev
        - libcusparse-dev
        - liblapack
        - libblas
        - nomkl
      run:
        - {{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}
        # Starting with CUDA 13.0 for Windows-only, cudart links are redirected to the
        # CUDA driver at compile time. Therefore, cuda-cudart is not needed.
        - cuda-cudart  # [(not win) or (cuda_compiler_version or "").startswith("12")]
        - libcublas
        - libcusparse
    test:
      commands:
        - test -f $PREFIX/lib/libmagma${SHLIB_EXT}                 # [unix]
        - if not exist %LIBRARY_PREFIX%\bin\magma.dll exit 1       # [win]
    about:
      home: https://icl.utk.edu/magma/
      dev_url: https://github.com/icl-utk-edu/magma/
      summary: The Matrix Algebra on GPU and Multicore Architectures (MAGMA) runtime libraries.
      description: >-
        This is a runtime package only. Developers should install libmagma-devel to build with MAGMA.
      license: BSD-3-Clause
      license_file: COPYRIGHT

  - name: libmagma_sparse
    files:
      include:
        - lib/libmagma_sparse.so  # [linux]
        - Library\bin\magma_sparse.dll  # [win]
    build:
      ignore_run_exports:
        - cuda-version
      ignore_run_exports_from:
        - cuda-cudart-dev
        - libcusparse-dev
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
        - libgomp  # [linux]
        - vcomp14  # [win]
        - arm-variant * {{ arm_variant_type }}  # [linux and aarch64 and cuda_compiler_version != "None"]
      host:
        - cuda-version {{ cuda_compiler_version }}
        - cuda-cudart-dev
        - libcusparse-dev
        - liblapack
        - nomkl
        - {{ pin_subpackage('libmagma', exact=True) }}
      run:
        - {{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}
        - {{ pin_subpackage('libmagma', exact=True) }}
        - cuda-cudart  # [(not win) or (cuda_compiler_version or "").startswith("12")]
        - libcusparse
    test:
      commands:
        - test -f $PREFIX/lib/libmagma_sparse${SHLIB_EXT}        # [unix]
        - if not exist %LIBRARY_PREFIX%\bin\magma_sparse.dll exit 1    # [win]
    about:
      home: https://icl.utk.edu/magma/
      dev_url: https://github.com/icl-utk-edu/magma/
      summary: The Matrix Algebra on GPU and Multicore Architectures (MAGMA) runtime libraries.
      description: >-
        This is a runtime package only. Developers should install libmagma-devel to build with MAGMA.
      license: BSD-3-Clause
      license_file: COPYRIGHT

  - name: libmagma-devel
    files:
      include:
        - include  # [unix]
        - lib/pkgconfig  # [unix]
        - Library\include  # [win]
        - Library\lib  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('libmagma', max_pin='x.x.x') }}
        - {{ pin_subpackage('libmagma_sparse', max_pin='x.x.x') }}
      ignore_run_exports:
        - cuda-version
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}
        - {{ stdlib('c') }}
        - libgomp  # [linux]
        - vcomp14  # [win]
        - arm-variant * {{ arm_variant_type }}  # [linux and aarch64 and cuda_compiler_version != "None"]
      host:
        - cuda-version {{ cuda_compiler_version }}
        - nomkl
        - {{ pin_subpackage('libmagma', exact=True) }}
        - {{ pin_subpackage('libmagma_sparse', exact=True) }}
      run:
        - {{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}
        - {{ pin_subpackage('libmagma', exact=True) }}  # [not win]
        - {{ pin_subpackage('libmagma_sparse', exact=True) }}  # [not win]
    test:
      commands:
        - test -f $PREFIX/include/magma.h                              # [unix]
        - if not exist %LIBRARY_PREFIX%\include\magma.h exit 1           # [win]
        - test -f $PREFIX/lib/libmagma${SHLIB_EXT}                       # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\magma.lib exit 1             # [win]
        - test -f $PREFIX/lib/libmagma_sparse${SHLIB_EXT}              # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\magma_sparse.lib exit 1      # [win]
        - test -f $PREFIX/lib/pkgconfig/magma.pc                       # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\pkgconfig\magma.pc exit 1    # [win]
      {% for each_header in magma_headers %}
        - test -f $PREFIX/include/magma_{{ each_header }}.h                       # [unix]
        - if not exist %LIBRARY_PREFIX%\include\magma_{{ each_header }}.h exit 1    # [win]
      {% endfor %}
      {% for each_header in magmasparse_headers %}
        - test -f $PREFIX/include/magmasparse_{{ each_header }}.h                       # [unix]
        - if not exist %LIBRARY_PREFIX%\include\magmasparse_{{ each_header }}.h exit 1    # [win]
      {% endfor %}
      {% for each_header in magmablas_headers %}
        - test -f $PREFIX/include/magmablas_{{ each_header }}.h                       # [unix]
        - if not exist %LIBRARY_PREFIX%\include\magmablas_{{ each_header }}.h exit 1    # [win]
      {% endfor %}

about:
  home: https://icl.utk.edu/magma/
  dev_url: https://github.com/icl-utk-edu/magma/
  summary: Matrix Algebra on GPU and Multicore Architectures (MAGMA)
  description: >-
    Matrix Algebra on GPU and Multi-core Architectures (MAGMA) is a collection of next-generation linear algebra libraries for heterogeneous computing. MAGMA supports interfaces for current linear algebra packages and standards (e.g., LAPACK and BLAS) to enable computational scientists to easily port any linear algebra–reliant
    software component to heterogeneous computing systems. MAGMA enables applications to fully exploit the power of current hybrid systems of many-core CPUs and multi-GPUs/coprocessors to deliver the fastest possible time to accurate solutions within given energy constraints.
  license: BSD-3-Clause
  license_file: COPYRIGHT

extra:
  feedstock-name: libmagma
  recipe-maintainers:
    - carterbox
    - conda-forge/pytorch-cpu
